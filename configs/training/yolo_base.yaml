# YOLO Training Base Configuration
# For MPS (Apple Silicon) - 16GB unified memory

model: yolov8m.pt
epochs: 100
imgsz: 512
batch: 8
device: mps
patience: 20
save_period: 10
workers: 4

# Optimizer
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005

# Augmentation (traditional)
augment: true
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 10
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0

# Validation
val: true
plots: true
