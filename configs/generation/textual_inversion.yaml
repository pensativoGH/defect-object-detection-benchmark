# Textual Inversion configuration for MPS (Apple Silicon)

# Base model
model_id: "runwayml/stable-diffusion-v1-5"
device: "mps"

# Training parameters
training:
  learning_rate: 5.0e-4
  max_train_steps: 2000  # Per class
  save_steps: 500
  gradient_accumulation_steps: 4
  num_train_images: 15  # Per class

# Token configuration
tokens:
  break:
    placeholder: "<cable-break>"
    initializer: "damage"
  thunderbolt:
    placeholder: "<cable-thunderbolt>"
    initializer: "burn"

# Generation parameters
generation:
  guidance_scale: 7.5
  num_inference_steps: 30
  num_samples: 100

# Output paths
output:
  embeddings_dir: "models/textual_inversion"
  synthetic_dir: "data/synthetic/textual_inversion"
