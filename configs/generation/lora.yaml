# LoRA configuration for MPS (Apple Silicon)

# Base model
model_id: "runwayml/stable-diffusion-v1-5"
device: "mps"

# LoRA architecture
lora:
  rank: 4  # Low rank for MPS memory constraints
  alpha: 4
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"
  dropout: 0.0

# Training parameters
training:
  learning_rate: 1.0e-4
  max_train_steps: 1000  # Per class
  save_steps: 250
  gradient_accumulation_steps: 4
  num_train_images: 20  # Per class
  use_8bit_adam: false  # Not supported on MPS

# Generation parameters
generation:
  guidance_scale: 7.5
  num_inference_steps: 30
  lora_scale: 0.8
  num_samples: 100

# Output paths
output:
  lora_dir: "models/lora"
  synthetic_dir: "data/synthetic/lora"
